version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: maverick-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: projectdb

  backend:
    build: ./backend
    container_name: maverick-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/projectdb
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production # <-- IMPORTANT: Change this!
      - PORT=8000
    # REMOVED the volumes section for deployment

  frontend:
    build:
      # We tell Docker where to find the Dockerfile
      context: ./screener-portal-new
      # And pass the correct API path as a build-time argument
      args:
        REACT_APP_API_URL: /api
    container_name: maverick-frontend
    restart: unless-stopped
    ports:
      # CHANGED to a safer port. You can change 3000 to 80 if you're sure it's free.
      - "3000:80"
    depends_on:
      - backend
    # REMOVED the incorrect environment variable

volumes:
  mongodb_data:
