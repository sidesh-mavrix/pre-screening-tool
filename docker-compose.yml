version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: maverick-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: projectdb

  backend:
    build: ./backend
    container_name: maverick-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/projectdb
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8000
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./screener-portal-new
    container_name: maverick-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  mongodb_data: